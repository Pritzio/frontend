<div class="search-page">
  <div class="search-page-container">
    <div class="search-header">
      <h1 class="page-title">Comparador de Precios</h1>
      <p class="page-subtitle">Encuentra las mejores ofertas en diferentes tiendas</p>
    </div>

    <app-search-bar
      (search)="onSearch($event)"
      [loading]="loading"
    ></app-search-bar>

    <!-- Filtros básicos -->
    <div class="filters-section">
      <div class="filter-group">
        <label for="availability-filter" class="filter-label">Disponibilidad:</label>
        <select 
          id="availability-filter"
          (change)="onAvailabilityFilterChange($event)"
          [disabled]="loading"
          class="filter-select"
        >
          <option value="">Todas</option>
          <option value="multiple">Múltiples tiendas</option>
          <option value="single">Una tienda</option>
        </select>
      </div>
    </div>

    <app-product-list
      [products]="products"
      [loading]="loading"
      [total]="total"
      [query]="query"
      (productSelect)="onProductSelect($event)"
    ></app-product-list>
  </div>
</div>
