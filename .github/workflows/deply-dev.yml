name: Update Container on Portainer
on:
  push:
    branches:
      - development

jobs:
  update-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Build and push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Iniciando la construcción y el empuje de la imagen Docker..."
          docker build --no-cache -t pritzio/frontend-dev:${{ github.sha }} .
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          docker push pritzio/frontend-dev:${{ github.sha }}
          echo "Construcción y empuje de la imagen Docker completados."

      - name: Deploy stack to Portainer
        uses: carlrygart/portainer-stack-deploy@v1
        with:
          portainer-host: https://portainer-dev.pritzio.cl
          username: ${{ secrets.PORTAINER_USERNAME }}
          password: ${{ secrets.PORTAINER_PASSWORD }}
          stack-name: 'frontend-dev'
          stack-definition: 'docker-compose-frontend.dev.yml'
          image: pritzio/frontend-dev:${{ github.sha }}
        env:
          GIT_SHA: ${{ github.sha }}
          